name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  tests:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every stable PHP the skeleton claims to support. "php": "^8.3"
        # means 8.3, 8.4 and 8.5: all three are proven here.
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, openssl
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # No sibling framework checkout exists in CI, so the path repository's
      # glob matches nothing and libxa/framework resolves from Packagist -
      # exactly what a real `composer create-project` does.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the application
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p database \
                   src/storage/framework/views \
                   src/storage/framework/cache/data \
                   src/storage/framework/sessions \
                   src/storage/logs
          touch database/database.sqlite
          php libxa key:generate --no-ansi

      - name: Lint
        run: composer lint

      - name: Run migrations
        run: php libxa migrate --no-ansi

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage --colors=always

  hygiene:
    name: Skeleton hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # A BOM is emitted as output before any header() call, which breaks
      # every response. Four bootstrap files shipped with one, and php -l
      # does not consider it an error.
      - name: No byte order marks
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            if [ "$(head -c3 "$file" | xxd -p)" = "efbbbf" ]; then
              echo "::error file=${file}::starts with a UTF-8 BOM"
              found=1
            fi
          done < <(find src tests tools -name '*.php' 2>/dev/null)
          [ "$found" -eq 0 ] || exit 1

      # These are regenerated by the framework and must never be committed -
      # a stale compiled view is served in preference to the real template.
      - name: No generated files committed
        run: |
          set -euo pipefail
          status=0
          for pattern in \
            'src/storage/framework/views/*.php' \
            'src/storage/logs/*.log' \
            'src/bootstrap/cache/*.php' \
            'database/*.sqlite'
          do
            matches=$(git ls-files "$pattern")
            if [ -n "$matches" ]; then
              echo "::error::generated files are tracked in git:"
              echo "$matches"
              status=1
            fi
          done
          exit $status

      # .env holds the APP_KEY and database credentials.
      - name: No secrets or archives committed
        run: |
          set -euo pipefail
          status=0

          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked in git"
            status=1
          fi

          # A tracked archive is almost always a stale snapshot of the project.
          # This repository carried a tests.zip containing an old copy of the
          # whole tree, .env included, which shipped to every new project.
          archives=$(git ls-files '*.zip' '*.tar' '*.tar.gz' '*.tgz' '*.rar' '*.7z')
          if [ -n "$archives" ]; then
            echo "::error::archives are tracked in git:"
            echo "$archives"
            status=1
          fi

          exit $status

      # This is an application, not a library: the lock file must be committed
      # so every environment installs identical versions.
      - name: composer.lock is committed and current
        run: |
          set -euo pipefail
          git ls-files --error-unmatch composer.lock > /dev/null 2>&1 \
            || { echo "::error::composer.lock must be committed for an application"; exit 1; }
          composer validate --no-check-all --no-check-publish

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    # There was no npm job at all, so nothing noticed that the skeleton's
    # frontend was unusable: @vitejs/plugin-react ^4 caps at vite 7 while
    # package.json pinned vite ^8, making `npm install` fail outright, and
    # vite.config.js pointed at entry files that did not exist in the
    # repository, so `npm run build` could never succeed either.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci` would need a committed lock file; the skeleton intentionally
      # ships only package.json so new projects resolve fresh. `install`
      # still fails loudly on an unsatisfiable peer-dependency tree.
      - name: Install
        run: npm install --no-fund --no-audit

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: The build produced a manifest where PHP looks for it
        run: |
          set -euo pipefail
          test -f src/public/build/manifest.json \
            || { echo "::error::vite must write src/public/build/manifest.json. The framework's vite() helper reads exactly that path"; exit 1; }
          echo "manifest OK"

  create-project:
    name: composer create-project
    runs-on: ubuntu-latest
    # Only on main/develop: it installs from scratch and is the slow one.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Newest supported version: a fresh install must work on what a new
          # user most likely has, not only on the oldest version we allow.
          php-version: "8.5"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, openssl
          coverage: none

      # The real test of a starter kit is whether a stranger can install it and
      # get a working application. Installing from this checkout as a local
      # path package reproduces `composer create-project` without needing the
      # release to be on Packagist yet.
      - name: Install this checkout as a fresh project
        run: |
          set -euo pipefail
          composer create-project libxa/libxa /tmp/fresh \
            --repository='{"type":"path","url":"'"${GITHUB_WORKSPACE}"'","options":{"symlink":false}}' \
            --stability=dev --no-interaction --no-progress

      - name: The fresh project boots and passes its own tests
        working-directory: /tmp/fresh
        run: |
          set -euo pipefail
          test -f .env || cp .env.example .env
          mkdir -p database src/storage/framework/views src/storage/logs
          touch database/database.sqlite
          php libxa key:generate --no-ansi
          php libxa migrate --no-ansi
          vendor/bin/phpunit --no-coverage --colors=always
